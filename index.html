<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Exclusiva - Ebooks & Curso de Tráfego Pago</title>
    <!-- Google Fonts -->
   
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff3366;
            --secondary-color: #1a1a2e;
            --accent-color: #00f2fe;
            --bg-color: #0f0f1a;
            --text-color: #ffffff;
            --card-bg: #16213e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Timer Bar */
        .timer-bar {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            text-align: center;
            padding: 12px 15px;
            font-weight: 700;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .timer-bar span {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
            text-align: center;
            flex: 1;
        }

        /* Title Section */
        .offer-title {
            font-size: clamp(1.3rem, 3.5vw, 2.4rem);
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.35;
            background: linear-gradient(45deg, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .offer-title span {
            color: var(--primary-color);
            -webkit-text-fill-color: var(--primary-color);
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .offer-subtitle {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: #b8b8d0;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Carousel Section */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 40px auto;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            will-change: transform;
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .carousel-slide img {
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .carousel-slide img:hover {
            transform: scale(1.02);
        }

        /* Carousel Navigation Buttons */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            transition: background 0.3s, transform 0.3s;
        }

        .carousel-btn:hover {
            background: var(--primary-color);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* Carousel Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.3s, width 0.3s;
        }

        .dot.active {
            background: var(--primary-color);
            width: 20px;
            border-radius: 4px;
        }

        /* Floating CTA Wrapper */
        .cta-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(15,15,26,0.95) 70%, rgba(15,15,26,0));
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            z-index: 999;
        }

        .floating-cta {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            padding: 16px 35px;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 800;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        .floating-cta:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.6);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(0, 242, 254, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        /* Audio Indicator Badge */
        .audio-badge {
            margin: 10px auto 70px auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .audio-badge span {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
        }

        /* Media Queries para ajuste fino em celulares menores */
        @media (max-width: 480px) {
            .container {
                padding: 20px 10px;
            }
            .carousel-slide img {
                max-width: 260px;
            }
            .carousel-btn {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Timer Bar -->
    <div class="timer-bar">
        <span>⚠️ ATENÇÃO: ESTA OFERTA EXPIRA EM:</span> <span id="countdown">10:00</span>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1 class="offer-title">
            BÓNUS DO DIA: Adquira um dos ebooks exclusivos na loja e ganhe acesso ao curso de <span>Marketing e Gestão de Tráfego Pago</span> (Aulas Prontas).
        </h1>
        <p class="offer-subtitle">Navegue abaixo para conferir alguns dos nossos ebooks exclusivos inclusos na promoção.</p>

        <!-- Carousel -->
        <div class="carousel-container" id="carousel">
            <div class="carousel-track" id="carouselTrack">
                <!-- 20 Ebooks Slides (Substitua os links das imagens conforme necessário) -->
                <div class="carousel-slide"><img src="1.jpg" alt="Ebook 1"></div>
                <div class="carousel-slide"><img src="2.jpg" alt="Ebook 2"></div>
                <div class="carousel-slide"><img src="3.jpg" alt="Ebook 3"></div>
                <div class="carousel-slide"><img src="4.jpg" alt="Ebook 4"></div>
                <div class="carousel-slide"><img src="5.jpg" alt="Ebook 5"></div>
                <div class="carousel-slide"><img src="6.jpg" alt="Ebook 6"></div>
                <div class="carousel-slide"><img src="7.jpg" alt="Ebook 7"></div>
                <div class="carousel-slide"><img src="8.jpg" alt="Ebook 8"></div>
                <div class="carousel-slide"><img src="9.jpg" alt="Ebook 9"></div>
                <div class="carousel-slide"><img src="10.jpg" alt="Ebook 10"></div>
                <div class="carousel-slide"><img src="11.jpg" alt="Ebook 11"></div>
                <div class="carousel-slide"><img src="13.jpg" alt="Ebook 12"></div>
                <div class="carousel-slide"><img src="16.jpg" alt="Ebook 13"></div>
                <div class="carousel-slide"><img src="18.jpg" alt="Ebook 14"></div>
                <div class="carousel-slide"><img src="22.jpg" alt="Ebook 15"></div>
                <div class="carousel-slide"><img src="23.jpg" alt="Ebook 16"></div>
                <div class="carousel-slide"><img src="24.jpg" alt="Ebook 17"></div>
                <div class="carousel-slide"><img src="27.jpg" alt="Ebook 18"></div>
                <div class="carousel-slide"><img src="31.jpg" alt="Ebook 19"></div>
                <div class="carousel-slide"><img src="43.jpg" alt="Ebook 20"></div>
            </div>

            <button class="carousel-btn prev-btn" id="prevBtn">&#10094;</button>
            <button class="carousel-btn next-btn" id="nextBtn">&#10095;</button>

            <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <!-- Audio Indicator -->
        
    </div>

    <!-- Floating CTA Button Wrapper -->
    <div class="cta-wrapper">
        <a href="http://ebooks-exclusivos.com.br/" class="floating-cta" target="_blank">OBTER OFERTA</a>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. Timer Decrescente de 10 minutos
        let timeInSeconds = 600;
        const countdownDisplay = document.getElementById('countdown');

        function updateTimer() {
            const minutes = Math.floor(timeInSeconds / 60);
            const seconds = timeInSeconds % 60;
            
            countdownDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeInSeconds > 0) {
                timeInSeconds--;
            } else {
                countdownDisplay.textContent = "00:00";
            }
        }
        setInterval(updateTimer, 1000);

        // 2. Lógica do Carrossel Dinâmico para 20 Imagens
        const track = document.getElementById('carouselTrack');
        const slides = Array.from(track.children);
        const nextButton = document.getElementById('nextBtn');
        const prevButton = document.getElementById('prevBtn');
        const dotsContainer = document.getElementById('carouselDots');
        let currentIndex = 0;

        // Criar os pontos de navegação dinamicamente
        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => {
                moveToSlide(index);
            });
            dotsContainer.appendChild(dot);
        });

        const dots = Array.from(dotsContainer.children);

        function updateDots(index) {
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function moveToSlide(index) {
            if (index < 0) {
                currentIndex = slides.length - 1;
            } else if (index >= slides.length) {
                currentIndex = 0;
            } else {
                currentIndex = index;
            }
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateDots(currentIndex);
        }

        nextButton.addEventListener('click', () => {
            moveToSlide(currentIndex + 1);
        });

        prevButton.addEventListener('click', () => {
            moveToSlide(currentIndex - 1);
        });

        // Auto-play do carrossel a cada 4 segundos
        let autoSlide = setInterval(() => {
            moveToSlide(currentIndex + 1);
        }, 4000);

        const carouselElement = document.getElementById('carousel');
        carouselElement.addEventListener('mouseenter', () => clearInterval(autoSlide));
        carouselElement.addEventListener('mouseleave', () => {
            autoSlide = setInterval(() => {
                moveToSlide(currentIndex + 1);
            }, 4000);
        });

        // Suporte a toque (Swipe) em dispositivos móveis
        let touchStartX = 0;
        let touchEndX = 0;

        carouselElement.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        carouselElement.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                moveToSlide(currentIndex + 1);
            }
            if (touchEndX > touchStartX + 50) {
                moveToSlide(currentIndex - 1);
            }
        }

        // 3. Sistema de Áudio ("OFERTA DO DIA") usando Text-to-Speech nativo
        function playOfferAudio() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Oferta do dia!");
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                utterance.pitch = 1.1;
                
                window.setTimeout(() => {
                    window.speechSynthesis.speak(utterance);
                }, 1000);
            }
        }

        window.addEventListener('load', () => {
            playOfferAudio();
        });
    </script>
</body>
</html>
